<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Your Doubt</title>
<style>
    body {
        margin:0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom right,#2e003e,#000000);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: white;
    }

    .container {
        background: rgba(255,255,255,0.05);
        padding: 40px;
        border-radius: 12px;
        width: 90%;
        max-width: 450px;
        text-align: center;
        box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }

    h2 {
        color: #bb86fc;
        margin-bottom: 25px;
    }

    input, textarea {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 6px;
        border: 1px solid #bb86fc;
        background: #1e1e1e;
        color: white;
        font-size: 14px;
    }

    input::placeholder, textarea::placeholder {
        color: #aaa;
    }

    textarea {
        resize: none;
        height: 120px;
    }

    .btn {
        padding: 12px 25px;
        margin: 10px 5px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        transition: 0.3s;
    }

    .send-btn {
        background: #bb86fc;
        color: black;
    }

    .send-btn:hover {
        background: #9a67ea;
    }

    .back-btn {
        background: #1e1e1e;
        color: #bb86fc;
        border: 1px solid #bb86fc;
        text-decoration: none;
    }

    .back-btn:hover {
        background: #9a67ea;
        color: black;
        border-color: #9a67ea;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Ask Your Doubt</h2>
    <input type="text" id="subject" placeholder="Subject Name">
    <input type="text" id="teacher" placeholder="Teacher Name">
    <textarea id="doubtText" placeholder="Type your doubt anonymously"></textarea>
    <div>
        <button class="btn send-btn" onclick="sendDoubt()">Send</button>
        <button class="btn back-btn" onclick="goBack()">Back</button>
    </div>
</div>

<script>
    function sendDoubt(){
        const subject = document.getElementById('subject').value.trim();
        const teacher = document.getElementById('teacher').value.trim();
        const doubtText = document.getElementById('doubtText').value.trim();

        if(!subject || !teacher || !doubtText){
            alert('Please fill all fields');
            return;
        }

        alert('Doubt sent successfully!');

        // Clear fields
        document.getElementById('subject').value = '';
        document.getElementById('teacher').value = '';
        document.getElementById('doubtText').value = '';
    }

    function goBack(){
        window.location.href = 'student.html';
    }
</script>

</body>
</html>
