<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom right,#2e003e,#000000);
        color: white;
    }

    /* --- Navigation Bar --- */
    nav {
        background: #2e003e;
        width: 100%;
        display: flex;
        justify-content: space-around;
        padding: 15px 0;
        position: sticky;
        top: 0;
        z-index: 10;
    }
    nav button {
        background: none;
        border: none;
        color: white;
        font-size: 16px;
        cursor: pointer;
        position: relative;
    }
    nav button:hover { color: #bb86fc; }

    /* Tooltips */
    nav button::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: -35px;
        left: 50%;
        transform: translateX(-50%);
        background: #3d0055;
        color: #fff;
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 12px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        box-shadow: 0 0 5px rgba(0,0,0,0.4);
    }
    nav button:hover::after {
        opacity: 1;
    }

    .container {
        max-width: 800px;
        margin: 30px auto;
        padding: 20px;
        text-align: center;
    }
    h2 { margin-bottom: 20px; }

    .overall, .subject, .defaulter {
        background: #2e003e;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    .green { background-color: #4CAF50; }
    .orange { background-color: #FF9800; }
    .red { background-color: #F44336; }
    .default { background-color: #2e003e; color: #bb86fc; }

    .subject-item {
        display: flex;
        justify-content: space-between;
        margin: 8px 0;
        padding: 8px;
        border-radius: 6px;
    }
</style>
</head>
<body>

<!-- Navigation Bar -->
<nav>
    <button data-tooltip="Go to Dashboard" onclick="goToPage('new1.html')">Dashboard</button>
    <button data-tooltip="Check Attendance" onclick="goToPage('attendance.html')">Attendance</button>
    <button data-tooltip="View Assignments" onclick="goToPage('assignments.html')">Assignments</button>
    <button data-tooltip="See Notes" onclick="goToPage('notes.html')">Notes</button>
    <button data-tooltip="Focus Mode" onclick="goToPage('focus.html')">Focus</button>
    <button data-tooltip="Reply to Doubts" onclick="goToPage('reply.html')">Reply</button>
</nav>

<div class="container">
    <h2>Your Attendance</h2>

    <!-- Overall Attendance -->
    <div id="overall" class="overall default">
        Overall Attendance: No Data
    </div>

    <!-- Subject-wise Attendance -->
    <div id="subjects" class="subject default">
        <h3>Subject-wise Attendance</h3>
        <div>No Data Available</div>
    </div>

    <!-- Defaulter Status -->
    <div id="defaulter" class="defaulter default">
        Defaulter Status: No Data
    </div>
</div>

<script>
function goToPage(page){
    window.location.href = page;
}

// Example attendance data
let attendanceData = {
    overall: 82, // percent
    subjects: [
        { name: "Math", percent: 78 },
        { name: "Science", percent: 65 },
        { name: "English", percent: 88 },
        { name: "History", percent: 35 } // defaulter
    ]
};

// Render overall attendance
let overallDiv = document.getElementById('overall');
if(attendanceData.overall !== undefined){
    overallDiv.textContent = `Overall Attendance: ${attendanceData.overall}%`;
    overallDiv.className = 'overall ' + (attendanceData.overall >= 75 ? 'green' : 'orange');
}

// Render subject-wise attendance
let subjectsDiv = document.getElementById('subjects');
if(attendanceData.subjects && attendanceData.subjects.length){
    subjectsDiv.innerHTML = '<h3>Subject-wise Attendance</h3>';
    attendanceData.subjects.forEach(sub => {
        let color = sub.percent >= 75 ? 'green' : (sub.percent >= 40 ? 'orange' : 'red');
        let div = document.createElement('div');
        div.className = `subject-item ${color}`;
        div.textContent = `${sub.name}: ${sub.percent}%`;
        subjectsDiv.appendChild(div);
    });
}

// Render defaulter status
let defaulterDiv = document.getElementById('defaulter');
let defaulters = attendanceData.subjects.filter(sub => sub.percent < 40);
if(defaulters.length){
    defaulterDiv.textContent = `Defaulter in: ${defaulters.map(d => d.name).join(', ')}`;
    defaulterDiv.className = 'defaulter red';
} else if(attendanceData.subjects && attendanceData.subjects.length){
    defaulterDiv.textContent = 'No Defaulters';
    defaulterDiv.className = 'defaulter green';
}
</script>

</body>
</html>
